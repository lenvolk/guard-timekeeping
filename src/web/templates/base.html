<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if refresh_seconds %}<meta http-equiv="refresh" content="{{ refresh_seconds }}">{% endif %}
  <title>{{ title }} | Timekeeping</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <div class="banner" role="note">
    Synthetic data only. Every site, post and person on this page is made up. DEV proof of concept.
  </div>
  <header class="top">
    <a class="brand" href="/">Timekeeping</a>
    <nav>
      <a href="/">Sites and guards</a>
      <a href="/status">Status</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
