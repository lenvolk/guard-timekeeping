{% extends "base.html" %}
{% block content %}
<section class="card signin">
  <h1>Sign in</h1>
  {% if notice %}<p class="flash notice" role="status">{{ notice }}</p>{% endif %}
  {% if error %}<p class="flash error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/signin" autocomplete="off">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="badge">Employee ID</label>
    <input id="badge" name="badge" value="{{ badge or '' }}" placeholder="G-1001" required autofocus
           autocapitalize="characters" spellcheck="false">
    <label for="dob">Date of birth</label>
    <input id="dob" name="dob" type="password" placeholder="MM/DD/YYYY" inputmode="numeric" required>
    <button type="submit">Sign in</button>
  </form>
  <p class="hint">Guards sign in with their badge number. Supervisors use their S- number.
    Five wrong tries lock the ID for five minutes.</p>
</section>
{% endblock %}
